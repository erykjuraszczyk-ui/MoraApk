name: Signed Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.MORA_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.MORA_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.MORA_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MORA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing MORA_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing MORA_KEY_ALIAS secret" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing MORA_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing MORA_KEY_PASSWORD secret" && exit 1)

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.MORA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mora-release.jks"
          chmod 600 "$RUNNER_TEMP/mora-release.jks"

      - name: Build signed release APK
        env:
          MORA_STORE_FILE: ${{ runner.temp }}/mora-release.jks
          MORA_STORE_PASSWORD: ${{ secrets.MORA_KEYSTORE_PASSWORD }}
          MORA_KEY_ALIAS: ${{ secrets.MORA_KEY_ALIAS }}
          MORA_KEY_PASSWORD: ${{ secrets.MORA_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Mora-REDMAGIC-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
